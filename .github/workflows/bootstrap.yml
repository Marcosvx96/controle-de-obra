name: Bootstrap do projeto Android

# Roda uma única vez: gera a pasta android/ com a configuração do Gradle
# compatível com o Flutter atual e cria a chave fixa de assinatura do app.
on:
  workflow_dispatch:

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Criar projeto base do Flutter
        run: |
          flutter config --no-analytics
          flutter create --org br.com.contratosllc \
            --project-name controle_mao_de_obra \
            --platforms android /tmp/base

      - name: Empacotar a pasta android
        run: |
          cd /tmp/base
          zip -r "$GITHUB_WORKSPACE/android-base.zip" android

      - name: Gerar chave de assinatura fixa
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/upload-keystore.jks" \
            -storetype JKS \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias upload \
            -storepass contratosllc2026 \
            -keypass contratosllc2026 \
            -dname "CN=Controle de Pagamento de Mao de Obra, OU=Contratos LLC, O=Contratos LLC, L=Jundiai, ST=SP, C=BR"

      - uses: actions/upload-artifact@v4
        with:
          name: android-base
          path: |
            android-base.zip
            upload-keystore.jks
          retention-days: 7
