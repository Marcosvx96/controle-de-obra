name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    name: Compilar APK e testar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Baixar dependências
        run: flutter pub get

      - name: Gerar ícones do app
        run: dart run flutter_launcher_icons

      - name: Analisar o código
        run: flutter analyze --no-fatal-infos

      - name: Rodar os testes
        run: flutter test

      - name: Configurar assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            printf 'storePassword=contratosllc2026\nkeyPassword=contratosllc2026\nkeyAlias=upload\nstoreFile=upload-keystore.jks\n' > android/key.properties
            echo "Assinatura de release configurada."
          else
            echo "Sem keystore: o APK vai sair assinado em modo debug."
          fi

      - name: Compilar o APK
        run: flutter build apk --release

      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Guardar o PDF de exemplo (conferência visual)
        uses: actions/upload-artifact@v4
        with:
          name: pdf-exemplo
          path: build/test-artifacts/*.pdf
          retention-days: 30
